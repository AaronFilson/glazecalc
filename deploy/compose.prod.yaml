# Production stack on the EC2 instance, in /opt/glazecalc (see deploy/README.md).
# The app image is built by CI and pulled from GHCR; nothing is built here.
#
#   GLAZECALC_TAG=<tag> docker compose -f compose.prod.yaml up -d   (deploy.sh does this)
#
# nginx on the host terminates HTTPS and proxies to 127.0.0.1:3000.
#
# Two networks. The app and MongoDB share the project's own (default). MongoDB
# is also on `data` (glazecalc_data), which the staging app joins to reach it
# (compose.staging.yaml): production's app is not on it, so staging cannot
# reach production's app, only MongoDB, where its user can use its own
# database and nothing else. `data` is internal: nothing on it reaches out.
name: glazecalc

# Container logs: Docker's "local" log driver rotates by itself (json-file does
# not by default). The limit is by size, not time: 5 files of 10 MB for each of
# the two containers (50 MB each at most), so on a quiet day they reach back
# many days and under load only hours. Nothing in them should name a person:
# the app logs error codes, never email addresses, and MongoDB is told not to
# log queries (--slowms below).
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: '5'

services:
  app:
    image: ghcr.io/aaronfilson/glazecalc:${GLAZECALC_TAG:-latest}
    restart: unless-stopped
    # Memory, on a 1 GB t4g.micro with a 2 GB swap file (setup-instance.sh) for
    # a moment's peak: MongoDB takes about 400 MB (its 0.25 GB cache, below, and
    # its own working memory), and Debian, Docker, the SSM agent and nginx about
    # 150 MB, which leaves the app about 450 MB. Node's heap is capped at 256 MB
    # (NODE_OPTIONS below: about what Node takes for itself on 1 GB, written
    # here so that a larger instance does not raise it unseen), and the
    # container at 512 MB. In use the process is about 120 to 220 MB; the
    # largest import (a 20 MB file of 20,000 records) peaks at 440 to 480 MB
    # with this heap (measured on a laptop, 2026-11-13), the swap file covering
    # the rest at that moment. An app that outgrows its heap stops and is started again
    # (restart, above), rather than pushing MongoDB into swap or out of memory.
    # Staging has its own, smaller limits (compose.staging.yaml).
    mem_limit: 512m
    # APP_SECRET, MONGODB_URI (with the app's MongoDB user and password),
    # MFA_KEY (two-step sign-in's key), the email settings and, once their
    # parameters exist, GOOGLE_/GITHUB_/MICROSOFT_CLIENT_ID and _CLIENT_SECRET
    # (sign in with Google, GitHub and Microsoft), written by deploy.sh from SSM Parameter Store
    # (root-only file).
    env_file: /opt/glazecalc/app.env
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=256
      # Where the site lives (server/lib/site.ts): mail links, the sitemap, and
      # the host passkeys belong to. Required in production. Production has no
      # SITE_LABEL, NOINDEX or MAIL_ALLOWLIST: those are for a staging copy.
      SITE_URL: https://glazecalcapp.com
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      mongo:
        condition: service_healthy
    logging: *logging

  mongo:
    image: mongo:9.0@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
    restart: unless-stopped
    # MongoDB production notes: an explicit cache size inside a container (this
    # leaves room for Node and nginx on a 1 GB t4g.micro) and a high open-files limit.
    # --auth: only the app's user may use the database. --slowms: operations slower
    # than this are written to the log with their filter (the values searched for,
    # such as an email address); the largest value means never.
    command: ['mongod', '--wiredTigerCacheSizeGB', '0.25', '--auth', '--slowms', '2147483647']
    # MONGO_APP_PASSWORD, written by deploy.sh from SSM Parameter Store (root-only
    # file). The image uses it once, to create the user in a new database; an
    # existing database gets its user by hand (deploy/README.md, MongoDB sign-in).
    env_file: /opt/glazecalc/mongo.env
    configs:
      - source: create-app-user
        target: /docker-entrypoint-initdb.d/create-app-user.js
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    networks:
      - default
      - data
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

# Runs once, when MongoDB starts on an empty data directory (before --auth applies):
# the app's user, who can read and write its own database and nothing else.
configs:
  create-app-user:
    content: |
      db.getSiblingDB('glazecalc').createUser({
        user: 'glazecalc',
        pwd: process.env.MONGO_APP_PASSWORD,
        roles: [{ role: 'readWrite', db: 'glazecalc' }]
      });

networks:
  default:
  # MongoDB and the staging app only (see the top). While staging runs,
  # production's `docker compose down` cannot remove it; staging.sh stop first.
  data:
    name: glazecalc_data
    internal: true

volumes:
  mongo-data:
  mongo-config:
