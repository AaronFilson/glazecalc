# The staging copy over HTTPS (docs/mfa-plan.md, "Phase 2"). Installed as
# /etc/nginx/sites-available/glazecalc-staging, and enabled, by
# `enable-https.sh --with-staging` once the certificate includes the name.
#   http://staging.glazecalcapp.com  -> https://staging.glazecalcapp.com (except Let's Encrypt checks)
#   https://staging.glazecalcapp.com -> the staging app on 127.0.0.1:3001
#
# It uses the log format "glazecalc" defined in sites-available/glazecalc,
# which nginx reads first (the files are read in name order), with its map
# that writes the provider callback's request line without the code and state. The headers and
# proxy settings repeat glazecalc-proxy.conf, apart from the port: keep the two
# in step. Production's files are not changed by this one.

server {
    listen 80;
    listen [::]:80;
    server_name staging.glazecalcapp.com;
    access_log /var/log/nginx/staging-access.log glazecalc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://staging.glazecalcapp.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.glazecalcapp.com;
    access_log /var/log/nginx/staging-access.log glazecalc;

    include snippets/glazecalc-tls.conf;

    server_tokens off;
    client_max_body_size 1m;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # As production (glazecalc.conf and glazecalc-proxy.conf), plus: no search
    # engine indexes or follows anything here, nginx's own replies included.
    # The app sends the same header (NOINDEX=1); it is hidden below, so each
    # reply carries it once.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Robots-Tag;
    }

    # As glazecalc-proxy.conf: the MCP endpoint, unbuffered.
    location = /mcp {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Robots-Tag;
    }

    # When staging is not running (staging.sh stop, or for a moment while
    # staging.sh swaps versions), say so, rather than nginx's "502 Bad Gateway".
    error_page 502 504 =503 @stopped;
    location @stopped {
        default_type text/plain;
        return 503 "The staging copy of Glazecalc is not running right now: it is stopped, or a new version is starting. Try again in a minute.\n";
    }
}
