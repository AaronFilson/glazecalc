# glazecalc over HTTPS. Installed as /etc/nginx/sites-available/glazecalc by
# enable-https.sh after certbot has the certificate for both names.
#   http://*                    -> https://glazecalcapp.com (except Let's Encrypt checks)
#   https://www.glazecalcapp.com -> https://glazecalcapp.com
#   https://glazecalcapp.com     -> the app on 127.0.0.1:3000

# nginx's "combined" log format without $remote_user: sign-in sends the email
# address as the HTTP Basic user name, which "combined" would write next to the IP.
# The request line is $request, except for the provider sign-in's callback
# (/api/auth/<provider>/callback), whose query carries the provider's one-time
# code and the state: that is written without its query. Every other request
# line is unchanged. The app's own error log does the same (server/lib/log.ts
# pathForLog). Keep this map and format the same in glazecalc.conf and
# glazecalc-http.conf, and in glazecalc-staging.conf (which has its own copy,
# named glazecalc_staging).
map $request $glazecalc_request {
    "~*^(\S+ /api/auth/[^/?\s]+/callback/?)\?[^ ]*( .*)?$" "$1$2";
    default $request;
}
log_format glazecalc '$remote_addr - - [$time_local] "$glazecalc_request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name glazecalcapp.com www.glazecalcapp.com;
    access_log /var/log/nginx/access.log glazecalc;

    # Renewals use the same check as the first certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://glazecalcapp.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.glazecalcapp.com;
    access_log /var/log/nginx/access.log glazecalc;

    include snippets/glazecalc-tls.conf;

    return 301 https://glazecalcapp.com$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name glazecalcapp.com;
    access_log /var/log/nginx/access.log glazecalc;

    include snippets/glazecalc-tls.conf;

    # Browsers remember for a year to use only HTTPS for this domain.
    add_header Strict-Transport-Security "max-age=31536000" always;

    include snippets/glazecalc-proxy.conf;
}
