# glazecalc over HTTPS. Installed as /etc/nginx/sites-available/glazecalc by
# enable-https.sh after certbot has the certificate for both names.
#   http://*                    -> https://glazecalcapp.com (except Let's Encrypt checks)
#   https://www.glazecalcapp.com -> https://glazecalcapp.com
#   https://glazecalcapp.com     -> the app on 127.0.0.1:3000

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name glazecalcapp.com www.glazecalcapp.com;

    # Renewals use the same check as the first certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://glazecalcapp.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.glazecalcapp.com;

    include snippets/glazecalc-tls.conf;

    return 301 https://glazecalcapp.com$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name glazecalcapp.com;

    include snippets/glazecalc-tls.conf;

    # Browsers remember for a year to use only HTTPS for this domain.
    add_header Strict-Transport-Security "max-age=31536000" always;

    include snippets/glazecalc-proxy.conf;
}
