# glazecalc over plain HTTP: the first-boot site, before a certificate exists.
# Installed as /etc/nginx/sites-available/glazecalc by setup-instance.sh, so the
# app can be tested by IP address or a hosts-file entry before the DNS switch.
# enable-https.sh replaces it with glazecalc.conf once certbot has a certificate.

# nginx's "combined" log format without $remote_user: sign-in sends the email
# address as the HTTP Basic user name, which "combined" would write next to the IP.
log_format glazecalc '$remote_addr - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name glazecalcapp.com www.glazecalcapp.com;
    access_log /var/log/nginx/access.log glazecalc;

    # Let's Encrypt's domain check (certbot --webroot writes the files here).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include snippets/glazecalc-proxy.conf;
}
