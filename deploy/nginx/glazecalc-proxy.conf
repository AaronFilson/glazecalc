# Shared by both glazecalc sites: proxy to the app container and response
# headers. Installed as /etc/nginx/snippets/glazecalc-proxy.conf and included
# at server level. Keep add_header out of location blocks: a location with its
# own add_header drops every header set here.

server_tokens off;
client_max_body_size 1m;

gzip_vary on;
# Level 5, not nginx's default 1: a little more CPU, 10 to 15% fewer bytes for
# scripts and styles (docs/prerender-compression-and-material-pages-plan.md).
# Pages and the sitemap come from the app already compressed (brotli or gzip,
# server/lib/compress.ts) with Content-Encoding set, and nginx's gzip skips any
# reply that has one, so it never compresses them twice.
gzip_comp_level 5;
# Express 5 sends .js as text/javascript (text/html is always compressed); the
# sitemap is application/xml, the web manifest application/manifest+json and
# robots.txt text/plain. Keep glazecalc-staging.conf the same
# (server/test/nginx_policy_tests.ts).
gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml application/manifest+json text/plain;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
# What any reply may load or send (docs/integrations-plan.md, item 7): only
# this site, nothing from another. It is one of three policies a page gets,
# and a load must pass all three, so each only narrows the others:
#   - this one, on every reply, nginx's own error pages included: everything
#     from this site; no plugins, no <base> elsewhere, no forms sent or frames
#     shown elsewhere, and no other site may frame the app (clickjacking);
#   - the app's header (server/app.ts), which allows Angular's inline styles
#     only with the reply's nonce;
#   - the build's <meta> tag (angular.json, autoCsp), which allows the inline
#     scripts only by their hashes, and scripts they load ('strict-dynamic').
# 'unsafe-inline' here is what lets the other two decide inline scripts and
# styles, by hash and nonce, which nginx cannot know: alone it would allow
# them, together with the others it allows only those. data: images are the
# check marks Bootstrap's stylesheet inlines as SVG. Test a change with
# e2e/csp.spec.js, which loads every page under all three.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The tools for AI assistants (docs/adr/0017-mcp-server.md): the same proxy,
# with buffering off, so the short event stream a 2025-era MCP client may get
# reaches it at once. The app checks the Host, the Origin and the limits itself.
location = /mcp {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Importing an account export (server/routes/import_routes.ts): the browser
# posts the whole file as JSON, up to 20 MB. Only these two paths take more
# than 1 MB; the app checks the size again, and who is signed in.
location ~ ^/api/import(/preview)?$ {
    client_max_body_size 20m;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
