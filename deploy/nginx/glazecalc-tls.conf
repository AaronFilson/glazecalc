# TLS settings for the glazecalc HTTPS servers: the Let's Encrypt certificate
# from certbot and Mozilla's "intermediate" profile (TLS 1.2 and 1.3).
# Installed as /etc/nginx/snippets/glazecalc-tls.conf by enable-https.sh.
# No OCSP stapling: Let's Encrypt stopped running OCSP in 2025.

ssl_certificate /etc/letsencrypt/live/glazecalcapp.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/glazecalcapp.com/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:glazecalc_tls:10m;
ssl_session_tickets off;
