# Glazecalc and MongoDB 9 in containers.
#
#   APP_SECRET=... docker compose up -d --build   (or put APP_SECRET in .env,
#                                                  with MFA_KEY, the email settings and SITE_URL)
#   docker compose run --rm app node scripts/seed-standard.js   (standard materials, once)
#   docker compose logs -f app
#   docker compose down             (data stays in the mongo-data volume)
#
# The app is published on 127.0.0.1 only: put a reverse proxy such as nginx in
# front for public access, since ports Docker publishes bypass ufw.
name: glazecalc

services:
  app:
    build: .
    image: glazecalc:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/glazecalc
      # Required in production; Compose stops with this message if it is unset.
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in the environment or in .env}
      # Email, as .env.example describes: off until MAIL_TRANSPORT is set.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Where people open the app (server/lib/site.ts): links in emails and the
      # host passkeys belong to. APP_URL is its older name and still works.
      SITE_URL: ${SITE_URL:-${APP_URL:-http://localhost:${APP_PORT:-3000}}}
      # The key for two-step sign-in's secrets (server/lib/mfa_key.ts). The app
      # runs as production here, which needs one, so this file has a fixed
      # TEST key, public and not secret: the base64 of
      # "glazecalc-compose-test-key-32byt". Fine for trying the app locally and
      # for CI; anything real sets its own (openssl rand -base64 32), and the
      # live site reads it from SSM (/glazecalc/mfa-key, deploy/deploy.sh).
      MFA_KEY: ${MFA_KEY:-Z2xhemVjYWxjLWNvbXBvc2UtdGVzdC1rZXktMzJieXQ=}
      # A copy that is not production (.env.example): empty, they do nothing.
      SITE_LABEL: ${SITE_LABEL:-}
      NOINDEX: ${NOINDEX:-}
      MAIL_ALLOWLIST: ${MAIL_ALLOWLIST:-}
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:9.0@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
    restart: unless-stopped
    environment:
      # MongoDB 8 and later stop at startup on Linux 6.19 through 7.0.13, which
      # GitHub's ubuntu-24.04 runners have had since image 20261018 (SERVER-121912).
      # Leaving rseq to glibc keeps tcmalloc off it, the workaround reported in
      # docker-library/mongo#765. Drop it once the runners have 7.0.14 or later.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongo-data:/data/db
      # The image declares this too; naming it stops a new unnamed volume
      # being left behind on every `docker compose down`.
      - mongo-config:/data/configdb
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
  mongo-config:
