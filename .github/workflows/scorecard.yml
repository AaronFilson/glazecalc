name: Scorecard

# OpenSSF Scorecard: how the repository stands on supply-chain practice (pinned
# actions, token permissions, CodeQL, Dependabot, a security policy, and more),
# published to https://scorecard.dev/viewer/?uri=github.com/AaronFilson/glazecalc
# for a badge. Its findings are kept as this run's artifact rather than sent to
# code scanning, which would list each check it marks down (Code-Review and
# Contributors, which a project of one cannot meet) as an alert.
#
# With publish_results, Scorecard checks this workflow itself: no top-level env
# or defaults, no run steps, only the actions it allows.
on:
  push:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1'
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # To publish the results, signed, through GitHub's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.json
          results_format: json
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.json
          retention-days: 30
