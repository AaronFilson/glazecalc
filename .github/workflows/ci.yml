name: CI

on:
  push:
    branches: [master]
  pull_request:

# The jobs only read the repository; nothing here needs to write.
permissions:
  contents: read

# The checks run side by side, each in a job of its own, and the browser tests
# are split across runners (--shard), so the run takes about as long as its
# slowest job. "Node 24" passes when all of them have.
#
# Ubuntu is pinned, so a new one comes by choice. The browser tests run in
# Playwright's own image instead (scripts/test-e2e-linux.Dockerfile), as
# npm run test:e2e:linux runs them locally, so their fonts are the same in both.
# Not 26.04 yet: its runners have Linux 7.0, and MongoDB 8 and later stop at
# startup on kernels 6.19 through 7.0.13 (its production notes), so neither the
# MongoDB service nor the one in the Docker job comes up. Move once the 26.04
# runners have kernel 7.0.14 or later. The 24.04 runners moved to such a kernel
# with image 20261018 too; MongoDB runs there with GLIBC_TUNABLES (compose.yaml
# says why). Node 24 LTS only, matching package.json
# "engines" and the Docker image.
jobs:
  checks:
    name: Lint, types, messages, formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; the tools installed from npm cannot read a token from .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check the server
        run: npm run typecheck

      - name: Messages (every key has its English; translations match it)
        run: npm run check:i18n

      - name: Check formatting
        run: npm run format:check

      - name: Check for known vulnerabilities
        run: npm audit --audit-level=high

  server:
    name: Server, mail forwarder and MCP tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:9.0
        # For Linux 6.19 through 7.0.13, as compose.yaml says.
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The server tests serve the built client's pages too.
      - name: Build client
        run: npm run build

      - name: Server and chemistry tests
        run: npm test

      - name: Mail forwarder tests
        run: npm run test:forwarder

      # The official MCP conformance suite (2026-07-28 and 2025-11-25) and the
      # MCP Inspector against /mcp on a server of its own. They are installed
      # apart from the app, from the lockfile in scripts/mcp-conformance/, with
      # no install scripts; this job has no secrets in its environment, and the
      # checkout keeps no GitHub token (persist-credentials: false above).
      - name: Install the MCP conformance tools
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/mcp-conformance

      - name: MCP conformance
        run: npm run test:mcp

  client:
    name: Client unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Client unit tests
        run: npm run test:client

  # In Playwright's image for its version, with its own MongoDB, exactly as
  # npm run test:e2e:linux runs them on a developer's machine: a third of the
  # tests on each runner, each with its share of the workers.
  e2e:
    name: Browser tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Each shard's report, merged into one by the job after.
      E2E_BLOB: '1'
      # The container's npm uses the runner's npm cache, which setup-node keeps.
      E2E_NPM_CACHE: /home/runner/.npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # The test image (Playwright's, with Node and fonts) is kept between runs,
      # for each Playwright version and each change to its Dockerfile.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Restore the test image
        id: image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/e2e-image.tar
          key: e2e-image-${{ steps.playwright.outputs.version }}-${{ hashFiles('scripts/test-e2e-linux.Dockerfile') }}

      - name: Load the test image
        if: steps.image.outputs.cache-hit == 'true'
        run: docker load -i /tmp/e2e-image.tar

      - name: Browser tests
        run: npm run test:e2e:linux -- --shard=${{ matrix.shard }}/3

      - name: Save the test image
        if: always() && steps.image.outputs.cache-hit != 'true'
        run: docker save -o /tmp/e2e-image.tar "$(docker image ls 'glazecalc-e2e:*' --format '{{.Repository}}:{{.Tag}}' | head -1)"

      - name: Keep this shard's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: test-results-linux/blob-report/
          retention-days: 7

      - name: Keep what failed (screenshots, traces)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-linux-${{ matrix.shard }}
          path: |
            test-results-linux/
            !test-results-linux/blob-report/
          retention-days: 7

  # One HTML report for the browser tests, from the shards' reports.
  e2e-report:
    name: Browser test report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge the reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The one check to require: it passes when every job above has.
  all:
    name: Node 24
    needs: [checks, server, client, e2e, docker]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do test "$result" = success; done

  # Builds the production image and runs it with MongoDB, as compose.yaml does.
  docker:
    name: Docker image
    # 24.04 for MongoDB's sake (see the top of this file).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_SECRET: ci-only-secret
      # The app runs as production, which needs a key for two-step sign-in's
      # secrets (server/lib/mfa_key.ts). This is compose.yaml's fixed TEST key,
      # public and not secret (the base64 of "glazecalc-compose-test-key-32byt"),
      # set here so the job never depends on that default. The live site's key
      # is in SSM (/glazecalc/mfa-key).
      MFA_KEY: Z2xhemVjYWxjLWNvbXBvc2UtdGVzdC1rZXktMzJieXQ=
      # compose.yaml passes these to the app: emails go to its log, linking here.
      MAIL_TRANSPORT: log
      APP_URL: http://ci.example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; the image's build cannot read a token from .git/config.
          persist-credentials: false

      # Whether this runner has a kernel MongoDB needs compose.yaml's workaround for.
      - name: Kernel
        run: uname -r

      - name: Build
        run: docker compose build

      - name: Start app and MongoDB
        run: docker compose up -d --wait --wait-timeout 120

      - name: Seed and check the API
        run: |
          docker compose run --rm app node scripts/seed-standard.js
          curl -fsS http://127.0.0.1:3000/ | grep -q '<title>Glazecalc'
          # The app's own pages come from the client too: /reset is where reset emails link.
          curl -fsS http://127.0.0.1:3000/reset | grep -q '<title>Glazecalc'
          # Sign up, then use the session it sets: __Host-glazecalc_session in production
          # (the reply also clears the older glazecalc_session, empty). The cookie is
          # Secure and this check runs over plain HTTP, so its token goes in a Bearer header.
          curl -fsS -D signup-headers.txt -o /dev/null -X POST -H 'Content-Type: application/json' \
            -d '{"email":"ci-check@test.com","password":"password123"}' http://127.0.0.1:3000/api/signup
          token=$(sed -nE 's/^[Ss]et-[Cc]ookie: __Host-glazecalc_session=([^;]+).*/\1/p' signup-headers.txt)
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:3000/api/verify |
            jq -e '.email == "ci-check@test.com"'
          count=$(curl -fsS http://127.0.0.1:3000/api/materials/getStandard | jq length)
          echo "standard materials: $count"
          test "$count" -eq "$(grep -c . data/materials.ndjson)"
          # The email settings reach the app: a reset email goes out, linking to APP_URL.
          curl -fsS -o /dev/null -X POST -H 'Content-Type: application/json' \
            -d '{"email":"ci-check@test.com"}' http://127.0.0.1:3000/api/password/forgot
          for _ in $(seq 1 10); do
            docker compose logs app | grep -qF "$APP_URL/reset#token=" && break
            sleep 1
          done
          docker compose logs app | grep -qF "$APP_URL/reset#token="

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
