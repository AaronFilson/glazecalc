name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Let both Node versions finish so a failure on one doesn't hide the other.
      fail-fast: false
      matrix:
        # package.json "engines" supports both; 24 is the version used day to day.
        node: [22, 24]

    services:
      mongodb:
        image: mongo:9.0
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        if: matrix.node == 24
        run: npm run lint

      - name: Check for known vulnerabilities
        if: matrix.node == 24
        run: npm audit --audit-level=high

      - name: Build client
        run: npm run build

      - name: Server and chemistry tests
        run: npm test

      - name: Client unit tests
        run: npm run test:client

      # Browser tests take longest, so they run on the main Node version only.
      - name: Install Playwright browser
        if: matrix.node == 24
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        if: matrix.node == 24
        run: npm run test:e2e

      - name: Keep the Playwright report
        if: failure() && matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Builds the production image and runs it with MongoDB, as compose.yaml does.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker compose build

      - name: Start app and MongoDB
        run: docker compose up -d --wait --wait-timeout 120

      - name: Seed and check the API
        run: |
          docker compose run --rm app node scripts/seed-standard.js
          curl -fsS http://127.0.0.1:3000/ | grep -q '<title>Glazecalc</title>'
          token=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"email":"ci-check@test.com","password":"password123"}' \
            http://127.0.0.1:3000/api/signup | jq -r .token)
          count=$(curl -fsS -H "token: $token" http://127.0.0.1:3000/api/materials/getStandard | jq length)
          echo "standard materials: $count"
          test "$count" -eq 34

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
