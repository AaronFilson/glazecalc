name: CI

on:
  push:
    branches: [master]
  pull_request:

# The jobs only read the repository; nothing here needs to write.
permissions:
  contents: read

jobs:
  build-and-test:
    # Node 24 LTS only, matching package.json "engines" and the Docker image.
    name: Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:9.0
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check the server
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Check for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Build client
        run: npm run build

      - name: Server and chemistry tests
        run: npm test

      - name: Client unit tests
        run: npm run test:client

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Builds the production image and runs it with MongoDB, as compose.yaml does.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: docker compose build

      - name: Start app and MongoDB
        run: docker compose up -d --wait --wait-timeout 120

      - name: Seed and check the API
        run: |
          docker compose run --rm app node scripts/seed-standard.js
          curl -fsS http://127.0.0.1:3000/ | grep -q '<title>Glazecalc'
          # Sign up, then use the session it sets. The cookie is Secure in production
          # and this check runs over plain HTTP, so its token goes in a Bearer header.
          curl -fsS -D signup-headers.txt -o /dev/null -X POST -H 'Content-Type: application/json' \
            -d '{"email":"ci-check@test.com","password":"password123"}' http://127.0.0.1:3000/api/signup
          token=$(sed -nE 's/^[Ss]et-[Cc]ookie: glazecalc_session=([^;]+).*/\1/p' signup-headers.txt)
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:3000/api/verify |
            jq -e '.email == "ci-check@test.com"'
          count=$(curl -fsS http://127.0.0.1:3000/api/materials/getStandard | jq length)
          echo "standard materials: $count"
          test "$count" -eq "$(grep -c . data/materials.ndjson)"

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
