name: Deploy

# Deploys a published image to the EC2 instance tagged app=glazecalc, by running
# /opt/glazecalc/deploy.sh through SSM Run Command (.github/scripts/ssm-run.sh),
# then checks the site from outside (Live checks). No SSH and no stored AWS
# keys: GitHub signs in to AWS with OIDC and assumes a role that may only run
# the glazecalc-deploy document (deploy/aws/deploy-document.json) on that
# instance, whose tag parameter AWS checks against the same pattern as below.
# deploy.sh backs up MongoDB first and installs nginx's files from the image's
# commit, so a release needs nothing run by hand on the instance.
#
# It starts by itself once Publish image has published a master commit, and
# waits for the production environment's reviewer: approve to deploy that
# commit, or reject to leave production as it is. A newer commit's run takes
# the place of one still waiting. Run it by hand to deploy another tag (a
# rollback).
#
# Setup (once): the AWS side in deploy/aws/README.md, then in the repository
# settings an environment named "production" (add yourself as a required
# reviewer) with variables AWS_DEPLOY_ROLE_ARN and AWS_REGION.
on:
  workflow_run:
    workflows: [Publish image]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag: latest or sha-<full commit SHA> (blank: this commit)'
        required: false
        type: string

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # After Publish image: only when it published, never for a failed run.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      ref: ${{ steps.deployed.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run deploy.sh on the instance
        env:
          TAG: ${{ inputs.tag || format('sha-{0}', github.event.workflow_run.head_sha || github.sha) }}
        run: .github/scripts/ssm-run.sh glazecalc-deploy '^(latest|sha-[0-9a-f]{40})$' "$TAG"

      # The deployed commit, for the Live checks to test it with its own checks;
      # "latest" is master's newest.
      - name: The deployed commit
        id: deployed
        env:
          TAG: ${{ inputs.tag || format('sha-{0}', github.event.workflow_run.head_sha || github.sha) }}
        run: |
          if [ "$TAG" = latest ]; then echo "ref=master" >> "$GITHUB_OUTPUT"; else echo "ref=${TAG#sha-}" >> "$GITHUB_OUTPUT"; fi

  check:
    needs: deploy
    permissions:
      contents: read
    uses: ./.github/workflows/live-checks.yml
    with:
      url: https://glazecalcapp.com
      ref: ${{ needs.deploy.outputs.ref }}
