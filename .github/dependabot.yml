# Weekly pull requests for dependency updates; CI tests each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Angular packages must move together (ng update handles migrations).
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      lint-and-format:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'globals', 'prettier']
      test-tools:
        patterns: ['vitest', '@vitest/*', 'jsdom', 'mocha', 'chai', 'chai-http', 'c8', '@playwright/test']
    ignore:
      # Angular sets the supported TypeScript range; move with an Angular update.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # The types follow the Node release the app runs on (24 LTS), moved with it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # The MCP conformance suite and Inspector CI installs apart (scripts/mcp-conformance/).
  - package-ecosystem: npm
    directory: /scripts/mcp-conformance
    schedule:
      interval: weekly

  # Lighthouse CI, which CI installs apart too (scripts/lighthouse/).
  - package-ecosystem: npm
    directory: /scripts/lighthouse
    schedule:
      interval: weekly

  # The AWS setup as CDK stacks, which the Infrastructure workflow installs apart (deploy/cdk/).
  - package-ecosystem: npm
    directory: /deploy/cdk
    schedule:
      interval: weekly
    groups:
      # The CLI must read the cloud assembly the library writes, so they move together.
      cdk:
        patterns: ['aws-cdk', 'aws-cdk-lib', 'constructs', 'cdk-nag']
    ignore:
      # The types follow the Node release the app runs on (24 LTS), moved with it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base image digests in the Dockerfile (node:24-slim) and the Compose files
  # (mongo:9.0). Major versions are moved by hand: Node only to an LTS release,
  # MongoDB with its featureCompatibilityVersion upgrade steps.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directories: ['/', '/deploy']
    schedule:
      interval: weekly
    ignore:
      - dependency-name: mongo
        update-types: ['version-update:semver-major']
