<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glazecalc: a free glaze chemistry calculator for potters</title>
    <meta
      name="description"
      content="Enter a glaze recipe and see its unity formula (UMF), silica to alumina ratio and flux balance. Free and open source, for recipes, materials and firing logs."
    />
    <base href="/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1a17" media="(prefers-color-scheme: dark)" />
    <!--
      What this browser knows, acted on before anything is drawn. Inline, so it runs before the first paint; the
      build's CSP allows it by its hash. The pages are prerendered, so the HTML that arrives is the same for
      everyone; this is how a reader's own state shows before the app has started.
      - The colors chosen in Settings, from this browser's copy (core/theme.ts keeps them in step once the app has
        started). The stylesheet is not split for "critical" inlining (angular.json), so the dark and palette
        rules are there for the first paint too.
      - A reader who chose a language opens an English page in it (i18n/own-language.ts is the same rule for a
        choice that arrives later). The lists are lib/regions/languages.js: the languages offered, and every
        language whose pages start with its code. client/app/index-html.spec.ts keeps them in step.
      - A signed-in reader gets data-session, which styles.scss uses to hide the landing page they are about to be
        sent past, so it does not flash (the app takes the attribute off if the session turns out to be over).
    -->
    <script>
      (() => {
        const root = document.documentElement;
        try {
          const mode = localStorage.getItem('theme');
          const palette = localStorage.getItem('palette');
          if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode);
          if (palette && palette !== 'tenmoku' && /^[a-z]+$/.test(palette)) root.setAttribute('data-palette', palette);
          const dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          root.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
          if (mode === 'light' || mode === 'dark') {
            for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
              meta.setAttribute('content', mode === 'dark' ? '#1e1a17' : '#f7f3ec');
            }
          }
        } catch {
          // Without storage the page follows the device.
        }
        try {
          const session = localStorage.getItem('session');
          if (session === 'account' || session === 'trial') root.setAttribute('data-session', session);
        } catch {
          // Without storage there is no session to hide the landing page for.
        }
        try {
          const chosen = localStorage.getItem('language');
          // prettier-ignore
          const offered = 'bg cs da de el es et fi fr ga hr hu it lt lv mt nl pl pt-PT ro sk sl sv ja tr zh-Hant ko zh-Hans id vi th ar hi'.split(' ');
          const prefixes = offered.concat('ur bn en-XA ar-XB ja-XC ar-XD hi-XE'.split(' '));
          const { pathname, search, hash } = location;
          if (
            offered.includes(chosen) &&
            !prefixes.includes(pathname.split('/')[1]) &&
            sessionStorage.getItem('readEnglish') !== '1'
          ) {
            // main.ts starts nothing for a page that is being left.
            root.setAttribute('data-leaving', '');
            location.replace('/' + chosen + pathname + search + hash);
          }
        } catch {
          // Without storage no language was chosen.
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glazecalc" />
    <meta property="og:title" content="Glazecalc: a free glaze chemistry calculator for potters" />
    <meta
      property="og:description"
      content="Enter a glaze recipe and see its unity formula (UMF), silica to alumina ratio and flux balance. Free and open source, for recipes, materials and firing logs."
    />
    <meta property="og:url" content="https://glazecalcapp.com/" />
    <meta property="og:image" content="https://glazecalcapp.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Glazecalc home page: free glaze chemistry for potters, beside a photo of fired cone packs."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <gc-root></gc-root>
  </body>
</html>
