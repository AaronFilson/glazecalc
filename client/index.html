<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glazecalc: a free glaze chemistry calculator for potters</title>
    <meta
      name="description"
      content="Enter a glaze recipe and see its unity molecular formula (UMF), silica to alumina ratio and flux balance. Free and open source; keep recipes, materials, notes and firing logs in one place."
    />
    <base href="/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1a17" media="(prefers-color-scheme: dark)" />
    <!--
      The colors chosen in Settings, from this browser's copy, before the first paint (core/theme.ts keeps
      them in step once the app has started). Inline, so it runs before anything is drawn; the build's CSP
      allows it by its hash. The stylesheet is not split for "critical" inlining (angular.json), so the
      dark and palette rules are there for the first paint too.
    -->
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const mode = localStorage.getItem('theme');
          const palette = localStorage.getItem('palette');
          if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode);
          if (palette && palette !== 'tenmoku' && /^[a-z]+$/.test(palette)) root.setAttribute('data-palette', palette);
          const dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          root.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
          if (mode === 'light' || mode === 'dark') {
            for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
              meta.setAttribute('content', mode === 'dark' ? '#1e1a17' : '#f7f3ec');
            }
          }
        } catch {
          // Without storage the page follows the device.
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glazecalc" />
    <meta property="og:title" content="Glazecalc: a free glaze chemistry calculator for potters" />
    <meta
      property="og:description"
      content="See any glaze recipe's unity molecular formula, and keep your recipes, materials and firing logs together."
    />
    <meta property="og:url" content="https://glazecalcapp.com/" />
    <meta property="og:image" content="https://glazecalcapp.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Glazecalc: understand your glazes, not just mix them." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <gc-root></gc-root>
  </body>
</html>
